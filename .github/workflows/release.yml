name: Release

# Push a tag like v0.1.0 to publish a GitHub Release with the zipped extension.
# scripts/package.sh refuses unless the manifest version and a dated CHANGELOG
# section match the tag.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Unit tests
        run: node --test tests/*.test.js

      - name: Package
        run: scripts/package.sh "${GITHUB_REF_NAME#v}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file dist/release-notes.md \
            "dist/duplicate-image-highlighter-${GITHUB_REF_NAME#v}.zip"
