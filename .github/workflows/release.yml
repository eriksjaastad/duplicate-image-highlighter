name: Release

# Push a tag like v0.1.0 on a commit in main to publish a GitHub Release with
# the zipped extension. scripts/package.sh refuses unless the manifest version
# and a dated CHANGELOG section match the tag. Pre-release tags do not trigger it.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag must be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Unit tests
        run: node --test tests/*.test.js

      - name: Package
        run: scripts/package.sh "${GITHUB_REF_NAME#v}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file dist/release-notes.md \
            "dist/duplicate-image-highlighter-${GITHUB_REF_NAME#v}.zip"
